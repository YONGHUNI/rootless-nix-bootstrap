name: CI

on:
  push:
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Syntax smoke test
        run: bash tests/smoke.sh
      - name: Command surface tests
        run: bash tests/commands.sh
      - name: Helper function tests
        run: bash tests/helpers.sh
      - name: Uninstall regression tests
        run: bash tests/uninstall.sh
      - name: ShellCheck
        run: shellcheck bootstrap.sh uninstall.sh doctor.sh versions.sh bin/nix lib/*.sh tests/*.sh

  integration-user-chroot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Allow unprivileged user namespace capabilities on Ubuntu 24.04
        run: |
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          fi
      - name: Probe user namespaces
        run: unshare --user --pid true
      - name: Full user-chroot lifecycle
        run: bash tests/integration.sh user-chroot

  integration-portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Full portable lifecycle
        run: bash tests/integration.sh portable
