name: CI

on:
  push:
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Syntax smoke test
        run: bash tests/smoke.sh
      - name: Command surface tests
        run: bash tests/commands.sh
      - name: Helper function tests
        run: bash tests/helpers.sh
      - name: Uninstall regression tests
        run: bash tests/uninstall.sh
      - name: ShellCheck
        run: shellcheck bootstrap.sh uninstall.sh doctor.sh versions.sh bin/nix lib/*.sh tests/*.sh

  integration-user-chroot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Full user-chroot lifecycle in privileged container
        run: bash tests/integration-user-chroot-docker.sh

  integration-portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Full portable lifecycle
        run: bash tests/integration.sh portable
